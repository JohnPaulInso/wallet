// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Force Java 17 for ALL subprojects
subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
            }
            // (2026-07-13) Ensure typedefs.txt for syncLibJars; prev: missing input file
            project.gradle.taskGraph.whenReady { taskGraph ->
                taskGraph.allTasks.findAll { it.project == project && it.name.startsWith("sync") && it.name.endsWith("LibJars") }.each { syncTask ->
                    def variant = syncTask.name.replace("sync", "").replace("LibJars", "")
                    def dir = new File(project.buildDir, "intermediates/annotations_typedef_file/${variant.uncapitalize()}/extract${variant}Annotations")
                    dir.mkdirs()
                    def f = new File(dir, "typedefs.txt")
                    if (!f.exists()) f.createNewFile()
                }
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
